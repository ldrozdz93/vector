version: '3'

services:
  local-azure-blob:
    image: mcr.microsoft.com/azure-storage/azurite:${CONFIG_VERSION}
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --loose
    ports:
    - "10000:10000"
    - "10001:10001"
    - "10002:10002"
    volumes:
    - /var/run:/var/run

networks:
  default:
    name: ${VECTOR_NETWORK}
    external: true
